    <!-- Scripts -->
    <!-- Suppress harmless browser extension errors - MUST be first script -->
    <script>
        // Immediately suppress extension errors before anything else runs
        (function () {
            'use strict';

            // Store original console methods
            const originalConsole = {
                error: console.error.bind(console),
                warn: console.warn.bind(console),
                log: console.log.bind(console)
            };

            // Helper to check if message is from extension
            function isExtensionError(message) {
                if (typeof message !== 'string') return false;
                const lower = message.toLowerCase();
                return lower.includes('runtime.lasterror') ||
                    lower.includes('back/forward cache') ||
                    lower.includes('message channel is closed') ||
                    lower.includes('extension context invalidated') ||
                    lower.includes('unchecked runtime.lasterror');
            }

            // Override console.error
            console.error = function (...args) {
                const message = args.map(arg =>
                    typeof arg === 'string' ? arg :
                        arg?.message || String(arg || '')
                ).join(' ');

                if (isExtensionError(message)) {
                    return; // Silently ignore
                }
                originalConsole.error.apply(console, args);
            };

            // Override console.warn
            console.warn = function (...args) {
                const message = args.map(arg =>
                    typeof arg === 'string' ? arg :
                        arg?.message || String(arg || '')
                ).join(' ');

                if (isExtensionError(message)) {
                    return; // Silently ignore
                }
                originalConsole.warn.apply(console, args);
            };

            // Override console.log to catch extension errors that might be logged
            const originalLog = console.log;
            console.log = function (...args) {
                const message = args.map(arg => String(arg || '')).join(' ');
                if (isExtensionError(message)) {
                    return; // Silently ignore
                }
                originalLog.apply(console, args);
            };

            // Global error handler with highest priority
            const errorHandler = function (event) {
                const message = event.message ||
                    event.error?.message ||
                    String(event.error || event);

                if (isExtensionError(message)) {
                    event.preventDefault();
                    event.stopPropagation();
                    event.stopImmediatePropagation();
                    return false;
                }
            };

            // Add error listeners with capture phase (runs first)
            window.addEventListener('error', errorHandler, true);
            window.addEventListener('unhandledrejection', function (event) {
                const message = event.reason?.message ||
                    String(event.reason || '');
                if (isExtensionError(message)) {
                    event.preventDefault();
                    event.stopPropagation();
                    return false;
                }
            }, true);

            // Override Error constructor
            const OriginalError = window.Error;
            window.Error = function (...args) {
                const error = new OriginalError(...args);
                if (isExtensionError(error.message)) {
                    // Create a silent error
                    Object.defineProperty(error, 'message', {
                        value: '',
                        writable: false,
                        configurable: false
                    });
                    Object.defineProperty(error, 'name', {
                        value: 'SilentExtensionError',
                        writable: false,
                        configurable: false
                    });
                }
                return error;
            };
            window.Error.prototype = OriginalError.prototype;

            // Also try to intercept at the DevTools level (if possible)
            if (window.chrome && window.chrome.runtime) {
                try {
                    // Wrap chrome.runtime to catch errors
                    const originalSendMessage = window.chrome.runtime.sendMessage;
                    if (originalSendMessage) {
                        window.chrome.runtime.sendMessage = function (...args) {
                            try {
                                return originalSendMessage.apply(this, args);
                            } catch (e) {
                                if (isExtensionError(e.message || String(e))) {
                                    return; // Silently ignore
                                }
                                throw e;
                            }
                        };
                    }
                } catch (e) {
                    // Ignore if we can't wrap chrome.runtime
                }
            }
        })();
    </script>
